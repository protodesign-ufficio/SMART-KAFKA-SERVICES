version: "3.8"

services:
  # =======================
  # BANCHINA
  # =======================
  bridge-banchina:
    image: bridge-banchina
    build:
      context: .
      dockerfile: Dockerfile.banchina
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - kafka-net

  bridge-banchina-docs:
    image: bridge-banchina
    command: faststream docs serve bridge_banchina:app --host 0.0.0.0 --port 8000
    ports:
      - "9001:8000"
    networks:
      - kafka-net

  # =======================
  # DELTA ETA
  # =======================
  bridge-deltaeta:
    image: bridge-deltaeta
    build:
      context: .
      dockerfile: Dockerfile.deltaeta
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - kafka-net

  bridge-deltaeta-docs:
    image: bridge-deltaeta
    command: faststream docs serve bridge_delta_eta:app --host 0.0.0.0 --port 8000
    ports:
      - "9000:8000"
    networks:
      - kafka-net

  # =======================
  # COMPONENTS
  # =======================
  bridge-components:
    image: bridge-components
    build:
      context: .
      dockerfile: Dockerfile.components
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - kafka-net

  bridge-components-docs:
    image: bridge-components
    command: faststream docs serve bridge_components:app --host 0.0.0.0 --port 8000
    ports:
      - "9002:8000"
    networks:
      - kafka-net

  # =======================
  # DECODER AIS
  # =======================
  # decoder-ais:
  #   image: decoder-ais
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.decoder_ais
  #   environment:
  #     BOOTSTRAP_SERVERS: kafka:9092
  #   restart: unless-stopped
  #   networks:
  #     - kafka-net

  # decoder-ais-sim:
  #   image: decoder-ais-sim
  #   build:
  #     context: .
  #     dockerfile: Dockerfile.decoder_ais_sim
  #   environment:
  #     BOOTSTRAP_SERVERS: kafka:9092
  #   restart: unless-stopped
  #   networks:
  #     - kafka-net

  # =======================
  # ARRIVO (GEOFENCING)
  # =======================
  bridge-arrivo:
    image: bridge-arrivo
    build:
      context: .
      dockerfile: Dockerfile.arrivo
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      GEOFENCE_RADIUS_M: "100"
      ARRIVAL_CONFIRM_COUNT: "1"
    restart: unless-stopped
    networks:
      - kafka-net

  bridge-arrivo-docs:
    image: bridge-arrivo
    command: faststream docs serve bridge_arrivo:app --host 0.0.0.0 --port 8000
    ports:
      - "9004:8000"
    networks:
      - kafka-net

  # =======================
  # DECODER AIS FASTSTREAM (SPLIT: main + sim separati)
  # =======================
  # Decoder SOLO per AIS reali (ais.raw -> ais_decoded.raw)
  decoder-ais-main:
    image: decoder-ais-faststream
    build:
      context: .
      dockerfile: Dockerfile.decoder_ais_faststream
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      DECODER_MODE: main
    restart: unless-stopped
    networks:
      - kafka-net

  # Decoder DEDICATO per simulazione (ais_simulation.raw -> ais_decoded_simulation.raw)
  # Istanza separata = event loop isolato, nessuna contesa con AIS reale
  decoder-ais-sim:
    image: decoder-ais-faststream
    build:
      context: .
      dockerfile: Dockerfile.decoder_ais_faststream
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
      DECODER_MODE: sim
    restart: unless-stopped
    networks:
      - kafka-net

  decoder-ais-faststream-docs:
    image: decoder-ais-faststream
    command: faststream docs serve decoder_ais_faststream:app --host 0.0.0.0 --port 8000
    ports:
      - "9003:8000"
    networks:
      - kafka-net

  # =======================
  # DOCS INDEX (porta 9005)
  # =======================
  docs-index:
    image: nginx:alpine
    ports:
      - "9005:80"
    volumes:
      - ./docs-index.html:/usr/share/nginx/html/index.html:ro
    restart: unless-stopped
    networks:
      - kafka-net

networks:
  kafka-net:
    external: true

