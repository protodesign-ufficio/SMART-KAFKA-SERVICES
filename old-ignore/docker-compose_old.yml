version: "3.8"

services:
  bridge-banchina:
    build:
      context: .
      dockerfile: Dockerfile.banchina
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - kafka-net

  bridge-deltaeta:
    build:
      context: .
      dockerfile: Dockerfile.deltaeta
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - kafka-net
  
    delta-eta-docs:
    image: bridge-delta-eta
    command: faststream docs serve bridge_delta_eta:app --port 9000
    ports:
      - "9000:9000"

  bridge-components:
    build:
      context: .
      dockerfile: Dockerfile.components
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - kafka-net
      
  decoder-ais:
    build:
      context: .
      dockerfile: Dockerfile.decoder_ais
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - kafka-net
      
      
  decoder-ais-sim:
    build:
      context: .
      dockerfile: Dockerfile.decoder_ais_sim
    environment:
      BOOTSTRAP_SERVERS: kafka:9092
    restart: unless-stopped
    networks:
      - kafka-net

networks:
  kafka-net:
    external: true
